name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU torch keeps the schedule/parallelism checks on)
        run: |
          pip install pyyaml
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile + validate configs
        run: make check PYTHON=python
