# SOTA dense model config — UltraModel 5 looped, *2-pass serving profile*.
# Derived from `sota_ultra_5_looped.yaml` and serves THAT file's checkpoint: identical
# stored stack (627B, prelude 32 / core 64 / coda 32), corpus, batch, LR ladder, gates and
# serving stack. The ONLY delta is the latent-depth ladder: every effort tier re-enters the
# shared core exactly twice (192 virtual layers, 937B compute params per token) instead of
# 1–4 times chosen by tier. "Same base weights, fewer passes" is the pattern a public
# Microsoft page (since edited; unverified) described for GPT-6.1 Sol vs GPT-6 Sol — used
# here as a design pattern, not as a fact about any vendor. Do NOT pretrain from this file:
# `training:`, the corpus and the compute anchor describe the base run that produced the
# weights (`implied_compute.serving_profile_of`) and are gate-checked to equal it. The
# post-training stages pin `recurrent_loops_max`, so pointing them at this file post-trains
# at exactly 2 passes. Efficiency arithmetic, caveats, how to serve: docs/LOOPED_2PASS_PROFILE.md.
#
# All numeric targets traceable to the SOTA UltraModel 5 System Card (the source of truth).
# The card pins nothing about depth recurrence; every recurrence number is operator-committed.
#
# UltraModel 5 is the generally-available configuration of MathsSchool's Mythos-class
# frontier model (same underlying weights as SecretUltraModel 5, plus production safeguards:
# security/bio/chem + distillation classifiers and fallback to the latest prior-generation
# model). The modelcard pins no architecture numbers, so the topology below is an operator
# commitment at the top of the 2026 frontier-dense band. The config.py dataclass defaults
# mirror `sota_ultra_5.yaml` (gate-checked by scripts/validate_config.py), not this file.
#
# Researched 2026 design space (knobs the modelcard does NOT pin numerically):
#
#   knob              UltraModel 5     reasoning
#   --------------    -------------    ----------------------------
#   d_model           18432            capability ceiling scales with width (band 14K–20K)
#   n_layers          128              depth for reasoning (band 100–180); 8 PP stages × 16
#   n_q_heads         144              144*128 = 18432 keeps head_dim 128
#   n_kv_heads (GQA)  18               8:1 group ratio; KV memory bound; shards at TP 9
#   head_dim          128              stable across the band
#   ffn_dim (mult)    73728 (4.0×d)    SwiGLU (3 proj): 4.0×d is deliberately FFN-heavy
#                                      (8/3×d ≈ 2.67×d would param-match a std 4×d MLP)
#   total params (B)  627              top of the 2026 frontier-*dense* band (400–700B).
#                                      Recompute via ModelConfig.estimate_params_billions() -> 627.06
#   train tokens (T)  36               2026 frontier-dense band 20–40T; 36T ≈ 2.9×
#                                      Chinchilla-optimal at 627B (optimal ≈ 12.5T)
#   precision train   fp8              Blackwell native FP8 (TE E4M3 fwd / E5M2 bwd);
#                                      NVFP4 via TE2 on Rubin; bf16 fallback
#   precision serve   fp8              Blackwell native fp8; Rubin native NVFP4
#   global batch tok  8M               larger model → larger stable batch (band 4–8M)
#   TP × PP × DP      9×8×64 = 4608    one replica = one GB300 NVL72 rack (9×8 = 72 GPUs, the
#                                      NVL72 NVLink domain). TP 9 divides the 18 KV heads —
#                                      TP 8 does not (18/8 = 2.25)
#   long-context      1M               modelcard-pinned: 1M window, 10M agentic w/ compaction
#   compaction        200K             modelcard-pinned compaction trigger
#   temperature       0.7              modelcard standard; lower per-route for reasoning
#   top_p             0.95             stable
#   img long edge     2576px           modelcard-pinned 2576px / 3.75 MP cap
#
# Effort ladder note: the modelcard reports low / medium / high / xhigh / max(adaptive)
# effort tiers. The dataclass exposes the canonical 5 (min/low/medium/high/max); the
# card's "xhigh" maps onto the deepest `max` budget below (USAMO xhigh attempts use
# ~100K tokens), and "adaptive max effort" is the default reasoning mode.

model:
  vocab_size: 200000
  d_model: 18432
  n_layers: 128
  n_q_heads: 144
  n_kv_heads: 18
  head_dim: 128
  ffn_dim: 73728
  norm_eps: 1.0e-5
  tie_embeddings: false
  # QK-norm: per-head RMSNorm on Q and K before RoPE — the 2026-standard
  # attention-logit stabilizer for fp8 training (Gemma-2/3, Qwen-3, OLMo-2;
  # replaces softcapping, which FA3 doesn't support). A variant config can switch it off.
  qk_norm: true
  # null → 1/sqrt(d_model) = 1/sqrt(18432) ≈ 0.00737; residual-out projections
  # additionally scaled by 1/sqrt(2 × 128) ≈ 0.0625 (modeling/transformer.py).
  init_std: null

  max_position_embeddings: 1048576
  rope_base: 1000000.0
  # YaRN scale must cover the full extension ratio: 1,048,576 / 8,192 = 128.
  # (A scale of 8 only reaches 64K and silently extrapolates beyond it,
  # breaking the modelcard-pinned 1M window — GraphWalks BFS/Parents @ 1M.)
  rope_yarn_scale: 128.0
  rope_yarn_original_max_position: 8192

  sliding_window_size: 32768
  sliding_window_layer_stride: 2

  # Per-layer overrides. Default empty (uniform layers). Operators land precise
  # param targets via tapered_ffn_overrides() or by editing this dict. For the
  # 1M/10M long-context retrieval evals (GraphWalks BFS/Parents 1M), forcing the
  # first and last layers to full attention helps:
  #
  # layer_overrides:
  #   0: {sliding_window: null}     # force full attention on first layer
  #   127: {sliding_window: null}   # …and last layer
  #
  # See `tapered_ffn_overrides(128, edge_layers=4, middle_ffn_dim=55296)` and
  # `hybrid_attention_overrides(128, full_attention_layers=(0, -1))`.
  layer_overrides: {}

  # --- Depth recurrence (looped transformer) — 2-pass serving profile ---------
  # Same stored stack as the base: 128 unique layers split prelude 32 / core 64 /
  # coda 32 (band edges on PP-8 stage boundaries), core re-entered with the
  # prelude output added back on every entry (input injection). The base run
  # sampled loops uniformly from 1..4 per optimizer step, so loops = 2 is a
  # trained depth (25% of the base's steps) — this profile pins it, no retrain.
  #
  #   loops   virtual layers   compute params (B)                                 use
  #   2       32+128+32 = 192   936.90  (1.49× stored; 0.60× the base's 1556.59 at 4)   every tier
  #
  # Why 2: 1 is UltraModel 5 itself (no latent depth); 4 is the base's max tier
  # at 1557B compute + 2880 KiB/token KV. 2 is the smallest depth that adds latent
  # reasoning over the flagship and the depth the base's `medium` tier already
  # serves, so it is exercised by the base's gates. Whether a flat 2 holds the
  # base's high/max-tier scores is NOT measured here — re-run the release gate.
  recurrent_prelude_layers: 32   # = base; gate-checked equal (shared weights)
  recurrent_core_layers: 64      # = base; gate-checked equal (shared weights)
  recurrent_loops_max: 2         # ≤ base loops_max 4 (gate). KV storage is sized here → 0.6× the base's provisioning
  # Flat ladder: the latent axis is fixed at 2 for every tier; the visible axis
  # (thinking_budgets) still scales with tier. Non-decreasing, as the gate requires.
  recurrent_loops_per_effort:
    min: 2
    low: 2
    medium: 2
    high: 2
    max: 2

  vision_enabled: true
  vision_patch_size: 14
  vision_max_image_pixels: 3750000
  # Max image tokens under the 3.75MP cap: ⌊3,750,000 / 14²⌋ / 4 (2×2 pixel
  # shuffle) = 4783; at exactly 2576px long edge it's 184 × 103 / 4 = 4738.
  vision_max_image_long_edge_px: 2576   # modelcard ScreenSpot-Pro pin

  # Budgets sized for UltraModel 5's long reasoning paths.
  # The card's "xhigh" effort (USAMO ~100K tokens/attempt) maps onto `max`.
  thinking_budgets:
    min: 0
    low: 1024
    medium: 8192
    high: 32768
    max: 131072
  thinking_token_min_floor: 32

  pad_token_id: 0
  bos_token_id: 1
  eos_token_id: 2

training:
  stage: foundation
  # AdamW remains the safe 2026 default. Set to "shampoo" or "muon" if the
  # operator has validated that path at frontier scale.
  optimizer: adamw
  # Width-scaled peak (LR ∝ 1/d_model, µP-style): the 3e-4 that is standard at
  # d_model 16384 scales to ≈ 2.67e-4 at 18432, committed at 2.5e-4 for fp8 headroom.
  lr: 2.5e-4
  beta1: 0.9
  beta2: 0.95           # 2026 frontier convention; lower than Adam's 0.999
  weight_decay: 0.1
  grad_clip: 1.0
  warmup_steps: 3000    # 3000 × 8.39M tok/step ≈ 25B warmup tokens (0.07% of the 36T corpus)
  # Full-corpus optimizer-step budget at the base batch: 36T tokens / 8M
  # tokens-per-step ≈ 4.29M. training/schedule.py splits the tokens 70/20/10
  # → ~3.01M foundation / 0.86M long-context / 1.72M refinement (at batch/4).
  total_steps: 4300000
  seq_len: 8192
  # Batch identity (enforced by TrainingConfig.__post_init__):
  #   global_batch_tokens = seq_len × micro_batch_size × grad_accum × dp_degree
  #   8,388,608           = 8192 × 1 × 16 × 64
  global_batch_tokens: 8388608   # 8M; larger model → larger stable batch (band 4–8M)
  micro_batch_size: 1            # sequences per replica per micro-step (627B + activations)
  grad_accum: 16
  mixed_precision: fp8  # TE fp8 on GB300 (Blackwell Ultra); "nvfp4" on Rubin TE2; "bf16" on Ampere/Hopper.
                        # DeepSpeed runs bf16 master/comm under TE (parallelism.deepspeed_config_for)
  grad_checkpointing: true
  zero_stage: 3
  # GB300 NVL72 layout — one replica = one rack: tp × pp = 9 × 8 = 72 B300s
  # (the rack IS the NVLink domain, so TP 9 stays on NVLink). World =
  # 9 × 8 × 64 = 4608 GPUs across 64 racks. Per-GPU shard at this layout:
  #   16 layers/PP stage (128 / 8), hidden slice 2048 (18432 / 9),
  #   16 q heads + 2 KV heads per TP rank (144 / 9, 18 / 9),
  #   ffn slice 8192 (73728 / 9), ≈8.7B params/GPU (627B / 72).
  # NOTE: TP must divide n_kv_heads — 18 shards at TP 9 or 6, NOT at TP 8.
  # Checked at launch by parallelism.validate_parallel_layout.
  tp_degree: 9
  pp_degree: 8
  dp_degree: 64
  lr_min_ratio: 0.1     # cosine floor = 10% of peak (wired into both trainer paths)
  z_loss_coef: 1.0e-4   # PaLM/OLMo-2 z-loss — logit-drift guard under fp8
  data_seed: 1234       # corpus interleave + shuffle-buffer seed (reproducible data order)
  # ≈2.0 s/step at 64 GB300 NVL72 racks (6·N·D per step ÷ 4608 × 7.5 PFLOPS
  # fp8 × 45% MFU) → checkpoints ≈ half-hourly, evals ≈ quarter-hourly.
  save_every_steps: 1000
  eval_every_steps: 500
  log_every_steps: 10
  long_doc_mix_ratio: 0.4
  sliding_window_layers_enabled: true

inference:
  # 2026 frontier serving samples with temperature + top_p only. top_k and
  # repetition penalty are 2023-era local-runtime knobs: top_k is redundant
  # under nucleus sampling, and repetition penalty distorts code/structured
  # output (a well-trained 1M-context model doesn't loop). Both disabled —
  # the sampler treats top_k <= 0 and penalty 1.0 as no-ops.
  temperature: 0.7
  top_p: 0.95
  top_k: 0
  repetition_penalty: 1.0
  max_new_tokens: 32768   # chat default; agentic computer-use raises per-turn cap to 128K (modelcard OSWorld)
  use_cache: true
  cache_implementation: paged
  use_flash_attention: true
  attention_dropout: 0.0
  kv_cache_dtype: fp8   # Blackwell default; "nvfp4" on Rubin; "bf16"/"int8"/"fp4" elsewhere
  page_block_size: 16
  enable_prefix_cache: true
  adaptive_thinking: true
  default_effort: high
  thinking_visible_to_user: false
  context_compaction_trigger: 200000
  max_context_tokens: 1048576
  max_agentic_context_tokens: 10485760  # 10M, with compaction

# ---------------------------------------------------------------------------
# IMPLIED values — required to deliver UltraModel 5 capability targets,
# but NOT stated as numerical knobs in the modelcard itself.
#
# These are what an operator must commit to even though modelcard is silent
# on them. They are NOT loaded by ModelConfig/TrainingConfig/InferenceConfig
# (which only consume the sections above). Use them for release gating,
# capacity planning, and post-training validation.
# ---------------------------------------------------------------------------

# Implied scale — operator must commit to a frontier-dense size band to land
# the §8 capability profile. Modelcard doesn't pin a number; current YAML lands
# at the values below. Recompute via ModelConfig.estimate_params_billions().
implied_scale:
  total_params_billions: 627          # STORED params = the base checkpoint (627.06B); the core is
                                      # counted once — this is the checkpoint size, shared with the base
  active_params_billions: 627         # dense; all stored params active per token
  # Compute params at loops 2 = stored + 1 × core, core = 64 × (attn 18432×(18432+2×2304)+
  # 18432×18432 + SwiGLU 3×18432×73728 + norms) ≈ 64 × 4.841B = 309.84B.
  # Gate-checked via ModelConfig.estimate_compute_params_billions():
  compute_params_billions_at_loops_max: 937      # 627.06 + 1 × 309.84 = 936.90B (loops 2 — the only depth served)
  # Inherited from the base run that produced the weights (mean loops 2.5, not this
  # file's 1.5): with serving_profile_of set, the gate checks it against the BASE.
  compute_params_billions_train_mean: 1092       # 627.06 + 1.5 × 309.84 = 1091.83B (base run, mean loops 2.5)
  virtual_layers_at_loops_max: 192               # 32 + 2×64 + 32
  # KV cache is indexed by VIRTUAL layer; the profile provisions at loops 2:
  # 192 × 18 × 128 × 2 (K+V) × 2 B = 1,769,472 B = 1728 KiB/token exactly
  # (1.5× UltraModel 5's 1152, 0.6× the base's 2880 at loops 4). At a full
  # 1M-token (= 1,048,576) context that is 1728 GiB exactly (≈ 1855 GB decimal).
  # Binary units for exact arithmetic; fp8 (the default kv_cache_dtype) halves both.
  kv_cache_kib_per_token_bf16: 1728            # at loops 2; fp8 → 864 KiB/token
  kv_cache_gib_at_1m_context_bf16: 1728        # at loops 2; fp8 → 864 GiB
  kv_cache_kib_per_token_bf16_at_loops_1: 1152 # = UltraModel 5; gate-checked (the base's loops-1 anchor)

# Implied training corpus — modelcard 1.1.1 names the source mix but pins no
# token count. Held at UltraModel 5's 36T: the looped variant changes compute
# per token, not the data commitment. Chinchilla framing is ambiguous under
# recurrence — 36T is 2.9× optimal against the 627B stored params but only
# ~1.65× against the 1092B mean compute params (Saunshi et al. 2025: loops buy
# reasoning depth, not knowledge capacity, so the stored-param view governs
# memorisation and the data budget stays).
implied_training_corpus:
  # Data points to train: 36T tokens = ~4.39B packed 8K sequences, consumed as
  # 1,024 sequences/step × 4.29M steps (closes the batch identity above).
  total_tokens_trillions: 36          # 2026 frontier-dense band: 20–40T (≈2.9× Chinchilla at 627B)
  # 2026 reasoning-era rebalance of 1.1.1's "publicly available internet +
  # public/private datasets + synthetic": heavier code/math than a classic
  # web-dominant mix, and synthetic reasoning traces get a dedicated bucket (the card's
  # 2.4.1 synthetic-data program). Loader expects one data-root subdir per key.
  source_mix_pct:
    web: 35                  # 12.60T tokens
    code: 22                 #  7.92T
    math_structured: 13      #  4.68T
    synthetic_reasoning: 10  #  3.60T
    academic: 8              #  2.88T
    books_reference: 7       #  2.52T
    dialogue_instructions: 5 #  1.80T   (per-source = pct × 36T; sums to 36T)
  # Operational pipeline knobs — consumed by training/corpus.py::
  # loader_config_from_yaml, which drives the PretrainingPipeline filter chain
  # and the block shuffle. These were previously hardcoded in code.
  pipeline:
    min_doc_chars: 200                    # drop short web fragments pre-dedup
    drop_duplicates: true                 # MinHash-LSH @ Jaccard 0.85 over 5-grams
    quality_filter: true                  # trained quality classifier
    toxicity_filter: true
    pii_redactor: true
    contamination_filter: true            # modelcard 9.2 URL + eval-text blocklist
    restrict_to_coverage_languages: true  # accept only implied_multilingual_coverage langs
    shuffle_buffer_blocks: 2048           # ~16.8M-token reservoir per worker at seq 8192

# Implied compute budget — needed to actually train the model above.
# Rough FLOP estimate 6·N·D = 6 × 627e9 × 36e12 ≈ 1.35e26 — top of the band.
# Reference platform: GB300 NVL72 (Blackwell Ultra). B300 fp8 dense peak is
# ~7.5 PFLOPS (FP4 dense 15, ~1.67× B200's 4.5 fp8), so 40–50% MFU sustains
# 3.0–3.75e15 FLOP/s per GPU → 1.35e26 / sustained / 3600 ≈ 10–12.5M B300-hours.
implied_compute:
  # This file serves the checkpoint trained under the base config named here;
  # every number in this section is the BASE run's. scripts/validate_config.py
  # sees `serving_profile_of` and checks: model: section equal to the base bar the
  # loop ladder, training: / corpus / schedule split equal, loops_max within the
  # base's trained range, and the FLOPs anchor = 6·N·D of the BASE (mean loops 2.5).
  # Training a 2-pass model from scratch would cost 6 × 781.98e9 × 36e12 = 1.689e26
  # — that is NOT this profile's cost; its weights are already paid for.
  serving_profile_of: configs/sota_ultra_5_looped.yaml
  reference_training_platform: "GB300 NVL72 — 64 racks × 72 B300 279GB (4608 GPUs, ≈1.28 PB HBM3E)"
  # Base anchor: 6 × N_compute(mean loops 2.5) × D = 6 × 1091.83e9 × 36e12 = 2.358e26.
  # Per-loop-count cost at 36T for reference: loops 1 → 1.35e26, 2 → 2.02e26, 4 → 3.36e26.
  training_flops_point_estimate: 2.358e+26   # inherited from the base; signed exponent — PyYAML floats require it
  training_flops_band: "2×10^26 to 4×10^26"         # point estimate 6·N·D ≈ 2.36e26
  pretraining_blackwell_hours_band: "17M to 22M"    # B300 hours, fp8: 2.358e26 ÷ (7.5e15 × 0.40–0.50) ÷ 3600
                                                    # = 17.5M–21.8M
  pretraining_h100_hours_band: "131M to 166M"       # Hopper fallback, bf16: H100 ≈0.99 PFLOPS dense ×
                                                    # 40–50% MFU → 2.36e26 ÷ 4.0–5.0e14 ÷ 3600 (B300 fp8 ≈ 7.6×/GPU)
  pretraining_wall_clock_weeks_band: "23 to 28"     # 17.5–21.8M hours ÷ 4608 GPUs = 22.6–28.2 weeks
  post_training_wall_clock_weeks_band: "6 to 10"    # SFT + RM + RLHF + CAI (unchanged)
  pretraining_dollar_band_usd: "88M to 153M"        # 17.5–21.8M B300-hours × $5–7/hr committed

# Implied 3-stage schedule split — modelcard implies long-context + refinement
# stages but doesn't fix the compute share or LR ladder. Consumed by
# training/schedule.py::schedule_for_config — the stage-2/3 LRs are pinned
# from here so the schedule and this YAML cannot drift apart.
implied_schedule_split:
  foundation_pct: 70
  foundation_lr: 2.5e-4   # = training.lr (gate-checked)
  long_context_pct: 20
  long_context_lr: 8.0e-5 # 0.32 × peak (≈ ⅓ ladder step, width-scaled)
  refinement_pct: 10
  refinement_lr: 4.0e-5   # 0.16 × peak (≈ ⅙ ladder step, width-scaled)

# Implied capability targets — modelcard §8 scoreboard; release gates.
# Values are the achieved UltraModel 5 (production, safeguards-on) numbers where
# the card reports them; otherwise the SecretUltraModel 5 number (same underlying
# weights), marked "(SUM5)". Gates use _min_pct/_max_pct suffixes (release_gate.py).
capability_targets:
  # 8.2 software engineering (UltraModel 5 production unless noted)
  swe_bench_verified_pct_min: 95            # SUM5 95.5
  swe_bench_pro_pct_min: 80                 # SUM5 80.3
  swe_bench_multilingual_pct_min: 92        # SUM5 92.2 (UltraModel not separately reported)
  swe_bench_multimodal_pct_min: 54          # SUM5 54.9
  frontiercode_diamond_pct_min: 29          # UltraModel 5 #1, 29.3 (30.2 pass rate)
  cursorbench_pct_min: 72                   # UltraModel 5 72.9 (Cursor production harness)
  # 8.3 terminal/coding agents
  terminal_bench_2_1_pct_min: 84            # UltraModel 5 84.3 (20.9% trials fall back to 4.8); SUM5 88.0
  # 8.8–8.12 reasoning / math / science (SecretUltraModel 5)
  gpqa_diamond_pct_min: 94                  # SUM5 94.1 (considered saturated)
  usamo_2026_pct_min: 98                    # SUM5 99.8 (med/high/xhigh), 98.3 (low)
  riemannbench_pct_min: 55                  # SUM5 55.0
  arxivmath_pct_min: 78                     # SUM5 78.52
  critpt_pct_min: 28                        # SUM5 28.6
  # 8.13 long context (the 1M target)
  graphwalks_bfs_256k_pct_min: 91           # SUM5 91.1
  graphwalks_bfs_1m_pct_min: 79             # SUM5 79.4
  graphwalks_parents_1m_pct_min: 97         # SUM5 97.5
  # 8.14 agentic search
  hle_no_tools_pct_min: 59                  # SUM5 59.0
  hle_with_tools_pct_min: 64                # SUM5 64.5
  browsecomp_pct_min: 88                    # SUM5 88.0 single-agent (93.3 multi-agent)
  deepsearchqa_f1_pct_min: 94               # SUM5 94.2
  draco_pct_min: 86                         # SUM5 86.4
  # 8.16 multimodal (these unlock from 2576px / 3.75 MP cap)
  osworld_pct_min: 85                       # UltraModel 5 / SUM5 85.0
  screenspot_pro_with_tools_pct_min: 90     # SUM5 90.7 (87.3 no tools)
  charxiv_with_tools_pct_min: 93            # SUM5 93.5
  lab_bench_figqa_with_tools_pct_min: 90    # SUM5 90.7 (UltraModel degrades: bio-image safeguards)
  gdp_pdf_strict_pct_min: 29                # UltraModel 5 29.8 strict pass rate (SOTA)
  blueprint_bench_2_pct_min: 38             # UltraModel 5 38.6 (SOTA)
  chartqapro_with_tools_pct_min: 72         # SUM5 72.9
  chartmuseum_with_tools_pct_min: 93        # SUM5 93.2
  # 8.17 real-world professional
  officeqa_pct_min: 79                      # SUM5 79 (internal agentic harness, safeguards-on)
  officeqa_pro_pct_min: 57                  # UltraModel 5 57.9 (Databricks vision harness, SOTA); 67.1 internal
  finance_agent_v2_pct_min: 56              # UltraModel 5 56.31 (Vals AI Finance Agent v2)
  real_world_finance_v2_elo_min: 1374       # UltraModel/SUM5 Elo (MedModel 4.6 anchored at 1000)
  legal_agent_benchmark_allpass_pct_min: 13 # UltraModel 5 #1 on Harvey held-out 13.3; SUM5 internal 16.91
  mcp_atlas_pct_min: 83                     # UltraModel 5 83.3
  toolathlon_pass_at_1_pct_min: 61          # UltraModel 5 / SUM5 61.7
  automationbench_pct_min: 17               # UltraModel 5 17.4 (Zapier private held-out)
  gdpval_aa_elo_min: 1932                   # UltraModel 5 1932 (Artificial Analysis, #1)
  # 8.18 healthcare
  healthbench_pct_min: 62                   # SUM5 62.7
  healthbench_professional_pct_min: 66      # SUM5 66.0
  # 8.19 multilingual
  gmmlu_avg_pct_min: 93                      # SUM5 93.2 avg across 42 languages
  milu_avg_pct_min: 92                       # SUM5 92.9 avg across 10 Indic languages + English
  include_avg_pct_min: 90                    # SUM5 90.5 avg across 44 languages
  # 8.20 life sciences
  structural_biology_open_pct_min: 87        # SUM5 87.2 open-ended
  biomystery_human_solvable_pct_min: 83      # SUM5 83.9 (Human-Difficult subset 46.1)
  proteingym_hard_pct_min: 44                # SUM5 44.8
  organic_chemistry_pct_min: 90              # SUM5 90.1
