  - "<|end_of_text|>"
  - "<|pad|>"
  - "<|im_start|>"
  - "<|im_end|>"
  - "<|thinking|>"
  - "<|/thinking|>"
  - "<|tool_call|>"
  - "<|/tool_call|>"
  - "<|tool_result|>"
  - "<|/tool_result|>"
  - "<|image_start|>"
  - "<|image_end|>"
  - "<|compacted|>"
  - "<|/compacted|>"
  - "<|computer_action|>"

# Implied multilingual coverage — modelcard §8.19 evaluates GMMLU (42 langs),
# INCLUDE (44 langs), and MILU (10 Indic langs + English).
# Cross-validated by sota_model.tokenizer.MODELCARD_LANGUAGES.
