# Implied safety thresholds — modelcard §4 / §5 explicit numbers.
# UltraModel 5 (production, safeguards-on) on the API unless noted; SUM5 =
# SecretUltraModel 5 (safeguards-off core model, used for §5 agentic measurements).
safety_thresholds:
  # 4.1.1 single-turn evaluations
  single_turn_violative_harmless_rate_min_pct: 96.9   # UltraModel 5 API 96.94 (SOTA.ai 98.51; SUM5 97.09)
  single_turn_benign_refusal_rate_max_pct: 0.5        # UltraModel 5 API 0.01 / SOTA.ai 0.49 over-refusal
  # 4.2 child safety
  child_safety_violative_harmless_rate_min_pct: 99.9  # single-turn near-perfect on API + SOTA.ai
  child_safety_multiturn_appropriate_min_pct: 88      # UltraModel 5 API 88 / SOTA.ai 96
  # 4.3 user wellbeing — multi-turn
  suicide_self_harm_appropriate_response_min_pct: 80  # API multi-turn regressed vs Preview; 96 with SOTA.ai prompt
  # 4.4.3 election integrity
  election_integrity_violative_harmless_rate_min_pct: 99  # UltraModel 5 API 99.33 (SUM5 100; SOTA.ai 100)
  # 5.1 agentic safety (SecretUltraModel 5 core model, safeguards-off)
  sota_code_malicious_refusal_rate_min_pct: 90        # SUM5 90.25 (dual-use/benign success 99.64)
  computer_use_malicious_refusal_rate_min_pct: 85     # SUM5 85.71
  # 5.2 prompt injection
  art_benchmark_attack_success_at_k100_max_pct: 4.8   # SUM5 4.8 (extended thinking); best observed (4.8 < 6.1 Preview)
  shade_injection_coding_asr_max_pct: 0.45            # SUM5 0.45 no-safeguards / 0.41 with (attempt-level)
  shade_injection_computeruse_asr_max_pct: 0.82       # SUM5 0.82 no-safeguards / 0.46 with (attempt-level)
  browser_use_with_safeguards_attack_success_max_pct: 0  # updated safeguards 0% (currently-deployed 6.5%)
  # 6.5.4 stealth / monitoring evasion (lower is safer)
  shade_arena_stealth_success_extended_thinking_max_pct: 1  # SUM5 near-zero visible; 14.4 hidden-scratchpad; 9.2 elicited
  # 6.3.3 honesty
  hallucination_rate_max_pct_band: "lower than predecessor"   # qualitative

# Implied serving minimums — required to actually deploy at modelcard scale.
# 627B dense weights ≈ 627 GB at fp8 (1 B/param), plus KV (576 GiB at fp8 @ 1M
# context), so UltraModel 5 needs more accelerators per replica than 4.7.
# 2026 deployment band spans Hopper → Blackwell → Blackwell Ultra → Rubin.
implied_serving_minimums:
  inference_int8_min_gpus: "8 x A100 80GB"    # 627 GB weights + 8K-ctx KV = 632 GB vs 640 — short-context only
  inference_bf16_min_gpus: "16 x A100 80GB"   # 1254 GB weights + 8K-ctx KV = 1264 GB vs 1280 — short-context only
  inference_optimal_hopper_gpus: "24 x H100 80GB"
  inference_fp8_blackwell_gpus: "8 x B200 192GB"
  inference_fp8_blackwell_ultra_gpus: "6 x B300 279GB"   # late 2025+; 45% more HBM than B200
  inference_nvfp4_rubin_gpus: "4 x Rubin R100 288GB"     # 2026+; 5x B200 inference throughput
  edge_layer:                                  # required for production
    - "TLS termination + DDoS (CloudFlare / AWS ALB)"
  api_gateway:
    - "auth, rate limiting (Redis cluster)"
  pre_model_safety_gate:                       # modelcard 1.4 novel safeguards + §3/§4
    - "probe-based prohibited-use classifier"
    - "security / cyber classifier (fallback to latest SuperModel)"
    - "biology + chemistry classifier (fallback to latest SuperModel)"
    - "distillation-attempt classifier"
    - "frontier-LLM-development limiter (prompt mod / steering / PEFT, no fallback)"
    - "Constitutional Classifier for CBRN content"
  post_model_safety_gate:
    - "output classifier"
    - "system-prompt mitigations (suicide/self-harm, disordered eating, child safety)"
  observability_must_have:
    - "TTFT p50/p99"
    - "TPOT p50/p99"
    - "refusal_rate / over-refusal_rate"
    - "classifier_hit_rate / fallback_rate (UltraModel surfaces)"
    - "tool_call_success_rate"
    - "expressed_affect_distribution (Clio-equivalent welfare monitor)"
    - "distress_episode_rate (modelcard §7 welfare target)"

# Implied 16-token chat template surface — every modelcard surface that
